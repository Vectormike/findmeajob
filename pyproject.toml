[project]
name = "findmeajob"
version = "0.1.0"
description = "A workflow of agents that finds jobs, applies, and tracks each case to the debrief"
authors = [
    { name = "Vectormike", email = "victorjonah199@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.2",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langmem>=0.0.30",
    "playwright>=1.64.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findmeajob = "findmeajob.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
